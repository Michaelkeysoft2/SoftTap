<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="facetGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="facetGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="facetOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="facetOrange2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="32" fill="url(#stBg)"/>

  <!-- 3D Multi-faceted StarTimes Star -->
  <g transform="translate(100, 78)" filter="url(#starShadow)">
    <!-- Top point -->
    <polygon points="0,0 0,-46 14,-14" fill="url(#facetGold1)"/>
    <polygon points="0,0 0,-46 -14,-14" fill="url(#facetGold2)"/>
    <!-- Right point -->
    <polygon points="0,0 44,-14 14,-14" fill="url(#facetGold2)"/>
    <polygon points="0,0 44,-14 20,12" fill="url(#facetOrange1)"/>
    <!-- Bottom right point -->
    <polygon points="0,0 26,40 20,12" fill="url(#facetOrange1)"/>
    <polygon points="0,0 26,40 0,16" fill="url(#facetOrange2)"/>
    <!-- Bottom left point -->
    <polygon points="0,0 -26,40 0,16" fill="url(#facetGold2)"/>
    <polygon points="0,0 -26,40 -20,12" fill="url(#facetOrange2)"/>
    <!-- Left point -->
    <polygon points="0,0 -44,-14 -20,12" fill="url(#facetGold1)"/>
    <polygon points="0,0 -44,-14 -14,-14" fill="url(#facetOrange1)"/>
  </g>

  <!-- StarTimes Wordmark -->
  <text x="100" y="165" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="1">StarTimes</text>
  <text x="100" y="180" text-anchor="middle" fill="#FECDD3" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" letter-spacing="2">DIGITAL TV</text>
</svg>
