<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="necoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5A2A"/>
      <stop offset="100%" stop-color="#062C14"/>
    </linearGradient>
    <linearGradient id="necoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="45%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="necoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#necoBg)"/>

  <!-- Golden Ring & Laurel Wreath -->
  <circle cx="100" cy="85" r="56" fill="none" stroke="url(#necoGold)" stroke-width="3"/>
  <circle cx="100" cy="85" r="51" fill="#0A3F1D" stroke="url(#necoGold)" stroke-width="1.2" opacity="0.9"/>

  <!-- Torch Flame -->
  <path d="M100,38 C105,47 109,53 105,59 C103,62 97,62 95,59 C91,53 95,47 100,38 Z" fill="url(#flame)"/>
  <polygon points="97,58 103,58 101,70 99,70" fill="url(#necoGold)"/>

  <!-- Open Book of Knowledge -->
  <path d="M74,84 C86,75 96,79 100,83 C104,79 114,75 126,84 L126,106 C114,97 104,101 100,105 C96,101 86,97 74,106 Z" 
        fill="url(#necoGold)" filter="url(#necoShadow)"/>
  <line x1="100" y1="83" x2="100" y2="105" stroke="#062C14" stroke-width="1.8"/>

  <!-- NIGERIA ribbon arc text -->
  <text x="100" y="122" text-anchor="middle" fill="#86EFAC" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="2">NIGERIA</text>

  <!-- Golden Banner -->
  <rect x="24" y="145" width="152" height="36" rx="10" fill="url(#necoGold)" filter="url(#necoShadow)"/>
  <text x="100" y="169" text-anchor="middle" fill="#062C14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3.5">NECO</text>
</svg>
