<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nbaisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#240738"/>
    </linearGradient>
    <linearGradient id="nbaisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="45%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="nbaisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#nbaisBg)"/>

  <!-- Golden Ring Frame -->
  <circle cx="100" cy="84" r="56" fill="none" stroke="url(#nbaisGold)" stroke-width="3"/>
  <circle cx="100" cy="84" r="50" fill="#3B0764" stroke="url(#nbaisGold)" stroke-width="1.2" opacity="0.9"/>

  <!-- Islamic Archway & Crescent Motif -->
  <path d="M78,92 C78,65 100,50 100,50 C100,50 122,65 122,92 Z" 
        fill="none" stroke="url(#nbaisGold)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star & Crescent -->
  <path d="M100,56 C97,56 94,59 94,63 C94,67 98,70 102,69 C99,69 97,66 97,63 C97,60 99,57 102,57 C101,56 100,56 100,56 Z" fill="url(#nbaisGold)"/>
  <circle cx="104" cy="62" r="1.5" fill="url(#nbaisGold)"/>

  <!-- Open Quran / Scripture on Rehal Stand -->
  <path d="M76,84 C86,76 96,80 100,83 C104,80 114,76 124,84 L124,104 C114,96 104,100 100,103 C96,100 86,96 76,104 Z" 
        fill="url(#nbaisGold)" filter="url(#nbaisShadow)"/>
  <line x1="100" y1="83" x2="100" y2="103" stroke="#240738" stroke-width="1.8"/>

  <!-- Subtitle Tag -->
  <text x="100" y="122" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2">ARABIC &amp; ISLAMIC</text>

  <!-- Gold Banner -->
  <rect x="24" y="145" width="152" height="36" rx="10" fill="url(#nbaisGold)" filter="url(#nbaisShadow)"/>
  <text x="100" y="169" text-anchor="middle" fill="#240738" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3.5">NBAIS</text>
</svg>
